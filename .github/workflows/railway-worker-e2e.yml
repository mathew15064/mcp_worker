name: Railway Worker WSS OAuth MCP E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-worker-wss-oauth-mcp:
    name: Go Worker WSS + OAuth S256 + MCP (required, no skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      BOT_REPORT_W2_T03_GO_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm

      - name: Use Go 1.26.10 for real Worker build
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: worker-go/go.sum

      - name: Verify Go and OpenSSL (must not skip)
        shell: bash
        run: |
          set -euo pipefail
          command -v go
          command -v openssl
          go version
          openssl version

      - name: Install Node dependencies
        run: npm ci

      - name: Compile and typecheck test sources
        run: |
          npm run typecheck
          npm run build

      - name: Execute real Go Worker WSS / OAuth PKCE / MCP E2E
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap dist/tests/railway-worker-wss-e2e.test.js | tee railway-worker-e2e.tap
          grep -qx '# tests 2' railway-worker-e2e.tap
          grep -qx '# pass 2' railway-worker-e2e.tap
          grep -qx '# fail 0' railway-worker-e2e.tap
          grep -qx '# skipped 0' railway-worker-e2e.tap

      - name: Attach TAP evidence (never binaries or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-worker-w2-t03-e2e-tap
          path: railway-worker-e2e.tap
          if-no-files-found: ignore
