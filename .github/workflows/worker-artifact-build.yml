name: Worker cross-platform artifacts (manual, no release)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/routes/workerRoutes.ts'
      - 'scripts/sign-worker-manifest.sh'
      - 'scripts/test-linux-installer-lifecycle.cjs'
      - 'tests/worker-signed-release*.test.ts'
      - 'worker/README.md'
      - '.github/workflows/worker-artifact-build.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker-go/go.mod
          cache-dependency-path: worker-go/go.sum

      - name: Test Worker
        run: |
          cd worker-go
          go test ./...

      - name: Build all Worker platforms
        run: ./scripts/build-worker-go.sh

      - name: Verify hashes and Linux binary
        run: |
          cd worker/bin
          sha256sum -c SHA256SUMS
          ./bot-report-worker-linux-amd64 version

      - name: Upload private CI artifacts for release review
        uses: actions/upload-artifact@v4
        with:
          name: worker-cross-platform-${{ github.sha }}
          path: |
            worker/bin/bot-report-worker-*
            worker/bin/WORKER_RELEASE
            worker/bin/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  installer-verification:
    # An ephemeral signer is created only inside a disposable runner. No
    # artifacts containing this key or its signatures are uploaded.
    name: Offline signed installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker-go/go.mod
          cache-dependency-path: worker-go/go.sum
      - name: Dependencies
        run: npm ci
      - name: Strict typecheck and compile test harness
        run: npm run typecheck && npm run build
      - name: Offline signature/checksum/version/rollback tests
        run: node --test dist/tests/worker-signed-release*.test.js
