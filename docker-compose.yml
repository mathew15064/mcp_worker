services:
  server:
    build:
      context: .
      args:
        MCP_WORKER_GIT_SHA: ${MCP_WORKER_GIT_SHA:-unknown}
        MCP_WORKER_TREE_SHA: ${MCP_WORKER_TREE_SHA:-unknown}
        MCP_WORKER_BUILD_TIME: ${MCP_WORKER_BUILD_TIME:-unknown}
    image: ${COMPOSE_PROJECT_NAME:-mcp_worker}-app:local
    restart: unless-stopped
    init: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      NODE_ENV: production
      PORT: "80"
      HOST: 0.0.0.0
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run setup.sh}
      SESSION_SECRET: ${SESSION_SECRET:?run setup.sh}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run setup.sh}
      MCP_PUBLIC_BASE_URL: http://127.0.0.1:${MCP_WORKER_PORT:-3333}
    ports:
      - "127.0.0.1:${MCP_WORKER_PORT:-3333}:80"
    volumes:
      - app-data:/app/data
volumes:
  app-data:
