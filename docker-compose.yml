services:
  bot-report:
    build:
      context: .
      args:
        BOT_REPORT_GIT_SHA: ${BOT_REPORT_GIT_SHA:-unknown}
        BOT_REPORT_TREE_SHA: ${BOT_REPORT_TREE_SHA:-unknown}
        BOT_REPORT_BUILD_TIME: ${BOT_REPORT_BUILD_TIME:-unknown}
    image: ${COMPOSE_PROJECT_NAME:-mcp_worker}-app:local
    restart: unless-stopped
    init: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      NODE_ENV: production
      PORT: "80"
      HOST: 0.0.0.0
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run setup.sh}
      SESSION_SECRET: ${SESSION_SECRET:?run setup.sh}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run setup.sh}
      MCP_PUBLIC_BASE_URL: http://127.0.0.1:${BOT_REPORT_PORT:-3333}
    ports:
      - "127.0.0.1:${BOT_REPORT_PORT:-3333}:80"
    volumes:
      - app-data:/app/data
volumes:
  app-data:
